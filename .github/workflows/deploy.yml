name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/DevPortfolio

            # --- Guardas: el deploy NUNCA puede perder trabajo del servidor ---------
            # 1) Tiene que estar en main (si no, movería otra rama).
            branch="$(git symbolic-ref --short -q HEAD || echo 'HEAD suelto')"
            if [ "$branch" != "main" ]; then
              echo "❌ Deploy abortado: el servidor está en '$branch', no en main."
              exit 1
            fi
            # 2) Sin cambios sin comitear ni ficheros nuevos sin versionar.
            if [ -n "$(git status --porcelain)" ]; then
              echo "❌ Deploy abortado: hay cambios locales sin comitear en el servidor:"
              git status --short
              exit 1
            fi

            git remote set-url origin git@github-portfolio:CarlosBTav/DevPortfolio.git
            git fetch origin main

            # 3) Sin commits locales que no estén en GitHub: se avanza solo con
            #    --ff-only, que falla en vez de descartar commits (nada de reset --hard).
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "❌ Deploy abortado: el servidor tiene commits que no están en GitHub:"
              git log --oneline origin/main..HEAD
              exit 1
            fi
            git merge --ff-only origin/main

            npm ci
            npm run build

            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            php artisan optimize

            echo "✅ Deploy completado: $(date)"
